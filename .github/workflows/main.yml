name: 숙소 예약 알림봇

on:
  workflow_dispatch:
  schedule:
    # 5분마다 실행. 대화가 없으면 곧바로 끝나고(사용 시간 절약),
    # 대화 중이면 최대 MAX_RUN_SEC 동안 머물며 버튼(달력)에 즉시 반응한다.
    # 실제 사이트 검색은 항목별로 1시간(SEARCH_INTERVAL_MIN)에 한 번만 수행한다.
    - cron: '*/5 * * * *'

permissions:
  contents: write

# 실행이 겹쳐 users.json 이 꼬이는 것을 방지
concurrency:
  group: accommodation-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 자체 테스트
        run: python -m unittest discover -s tests -q

      - name: 봇 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SEARCH_INTERVAL_MIN: '60'   # 항목별 검색 주기(분)
          NOTIFY_INTERVAL_MIN: '60'   # 같은 결과 재알림 최소 간격(분)
          POLL_TIMEOUT_SEC: '20'      # 대화 중 long polling 대기(초)
          IDLE_EXIT_SEC: '150'        # 이 시간 동안 조용하면 실행 종료(초)
          MAX_RUN_SEC: '900'          # 한 번의 실행 상한(초, 최대 15분 온라인)
        run: python bot.py

      - name: 변경된 users.json 저장
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add users.json
          if git diff --cached --quiet; then
            echo "저장할 변경 사항 없음"
            exit 0
          fi
          git commit -m "Update user database"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 실패, ${attempt}회차 재시도"
            sleep $((2 ** attempt))
          done
          exit 1
