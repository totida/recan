name: 숙소 예약 알림봇

on:
  workflow_dispatch:
  schedule:
    # 이 예약은 '봇을 다시 띄우는 방아쇠'다.
    # 한 번 뜨면 MAX_RUN_SEC(약 5시간 30분) 동안 계속 켜져 있으면서
    # SEARCH_INTERVAL_MIN 마다 검색하고, 버튼 입력에는 1초 안에 반응한다.
    # GitHub 가 예약 실행을 미루더라도 실행 하나가 길어서 공백이 거의 없다.
    - cron: '*/5 * * * *'

permissions:
  contents: write

# 봇이 둘 이상 동시에 돌면 텔레그램 메시지를 서로 가져간다.
# 앞선 실행이 끝날 때까지 기다렸다가 이어받는다.
concurrency:
  group: accommodation-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 봇이 실행 중에 커밋·푸시하므로 전체 이력이 필요

      # 예약 실행으로 뜬 작업은 '대기열에 들어간 시점'의 커밋을 받는다.
      # 앞선 실행이 5시간 넘게 돌면 그만큼 옛날 상태로 시작하게 되므로,
      # 브랜치의 최신 상태로 맞춘 뒤 시작한다. (덤으로 detached HEAD 도 해소)
      - name: 최신 상태로 맞추기
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git log -1 --format='시작 지점: %h  %ci'

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 자체 테스트
        run: python -m unittest discover -s tests -q

      - name: 저장 설정
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 봇 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SEARCH_INTERVAL_MIN: '10'   # 항목별 검색 주기(분)
          NOTIFY_INTERVAL_MIN: '120'  # 빈방이 계속 열려 있을 때 다시 알리는 간격(분)
          POLL_TIMEOUT_SEC: '20'      # long polling 대기(초)
          IDLE_EXIT_SEC: '0'          # 0 = 조용해도 종료하지 않음(상시 대기)
          MAX_RUN_SEC: '19800'        # 5시간 30분 뒤 종료 → 다음 실행이 이어받음
          GIT_PERSIST: '1'            # 등록 내용이 바뀔 때마다 즉시 저장
          # 아래 둘이 모두 있으면 등록 내용을 비공개 Gist 에 저장한다.
          # (공개 저장소에 쓰는 사람의 채팅 ID·감시 목록이 남지 않도록)
          # 시크릿이 없으면 지금까지처럼 저장소의 users.json 에 저장한다.
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          # 주인을 못 박고 싶을 때만 넣는다. 비워 두면 이미 쓰고 있는
          # 사람이 주인이 되고, 그 뒤로는 바뀌지 않는다.
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: python bot.py

      - name: 남은 변경 사항 저장
        if: always()
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -n "$GIST_ID" ]; then
            echo "등록 내용은 Gist 에 저장되므로 저장소에 남길 것이 없습니다"
            exit 0
          fi
          git add users.json
          if git diff --cached --quiet; then
            echo "저장할 변경 사항 없음"
            exit 0
          fi
          git commit -m "Update user database"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push 실패, ${attempt}회차 재시도"
            sleep $((2 ** attempt))
          done
          exit 1
